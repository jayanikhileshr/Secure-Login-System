<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Login System</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
  background:#111827;
  border:1px solid #1f2937;
  border-radius:16px;
  padding:30px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
  text-align:center;
  margin-bottom:25px;
  font-size:28px;
}

.tabs{
  display:flex;
  margin-bottom:20px;
  background:#1f2937;
  border-radius:10px;
  overflow:hidden;
}

.tabs button{
  flex:1;
  padding:12px;
  border:none;
  background:none;
  color:#9ca3af;
  cursor:pointer;
  font-size:15px;
  transition:0.3s;
}

.tabs button.active{
  background:#2563eb;
  color:white;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  color:#d1d5db;
}

.input-box{
  position:relative;
}

input{
  width:100%;
  padding:12px 45px 12px 12px;
  border:none;
  outline:none;
  border-radius:10px;
  background:#1f2937;
  color:white;
  font-size:15px;
}

.input-box i{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:#9ca3af;
}

button.submit-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
}

button.submit-btn:hover{
  background:#1d4ed8;
}

.message{
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  display:none;
}

.success{
  background:#14532d;
  color:#bbf7d0;
}

.error{
  background:#7f1d1d;
  color:#fecaca;
}

.features{
  margin-top:25px;
  border-top:1px solid #1f2937;
  padding-top:20px;
}

.features h3{
  margin-bottom:10px;
  font-size:16px;
}

.features ul{
  padding-left:20px;
  color:#cbd5e1;
}

.features li{
  margin-bottom:8px;
  font-size:14px;
}

.password-strength{
  height:6px;
  background:#374151;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.password-fill{
  height:100%;
  width:0%;
  background:red;
  transition:0.3s;
}
</style>
</head>

<body>

<div class="container">

<h1>Secure Login</h1>

<div class="tabs">
  <button class="active" id="loginTab">Login</button>
  <button id="registerTab">Register</button>
</div>

<form id="authForm">

<div class="form-group">
<label>Email</label>
<div class="input-box">
<input type="email" id="email" placeholder="Enter email" required>
<i class="ti ti-mail"></i>
</div>
</div>

<div class="form-group">
<label>Password</label>
<div class="input-box">
<input type="password" id="password" placeholder="Enter password" required>
<i class="ti ti-lock"></i>
</div>

<div class="password-strength">
<div class="password-fill" id="strengthFill"></div>
</div>

</div>

<div class="form-group" id="confirmBox" style="display:none;">
<label>Confirm Password</label>
<div class="input-box">
<input type="password" id="confirmPassword" placeholder="Confirm password">
<i class="ti ti-shield-lock"></i>
</div>
</div>

<button type="submit" class="submit-btn">Login</button>

<div class="message" id="messageBox"></div>

</form>

<div class="features">
<h3>Security Features</h3>

<ul>
<li>✔ Password hashing using bcrypt/Argon2</li>
<li>✔ SQL Injection prevention</li>
<li>✔ Session management</li>
<li>✔ Logout functionality</li>
<li>✔ Input validation</li>
<li>✔ Optional 2FA support</li>
</ul>

</div>

</div>

<script>
const loginTab = document.getElementById('loginTab');
const registerTab = document.getElementById('registerTab');
const confirmBox = document.getElementById('confirmBox');
const submitBtn = document.querySelector('.submit-btn');
const authForm = document.getElementById('authForm');
const messageBox = document.getElementById('messageBox');
const password = document.getElementById('password');
const strengthFill = document.getElementById('strengthFill');

let mode = "login";

loginTab.addEventListener('click', () => {
  mode = "login";

  loginTab.classList.add('active');
  registerTab.classList.remove('active');

  confirmBox.style.display = "none";

  submitBtn.textContent = "Login";

  hideMessage();
});

registerTab.addEventListener('click', () => {
  mode = "register";

  registerTab.classList.add('active');
  loginTab.classList.remove('active');

  confirmBox.style.display = "block";

  submitBtn.textContent = "Register";

  hideMessage();
});

password.addEventListener('input', () => {

  const val = password.value;

  let strength = 0;

  if(val.length >= 8) strength++;
  if(/[A-Z]/.test(val)) strength++;
  if(/[0-9]/.test(val)) strength++;
  if(/[^A-Za-z0-9]/.test(val)) strength++;

  const widths = ["0%","25%","50%","75%","100%"];
  const colors = ["red","orange","yellow","#22c55e","#16a34a"];

  strengthFill.style.width = widths[strength];
  strengthFill.style.background = colors[strength];
});

authForm.addEventListener('submit', (e) => {

  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const pass = password.value.trim();

  if(!email || !pass){
    showMessage("All fields are required","error");
    return;
  }

  if(mode === "register"){

    const confirm = document.getElementById('confirmPassword').value.trim();

    if(pass !== confirm){
      showMessage("Passwords do not match","error");
      return;
    }

    if(pass.length < 8){
      showMessage("Password must contain at least 8 characters","error");
      return;
    }

    showMessage("Registration successful (Demo UI)","success");

  } else {

    showMessage("Login successful (Demo UI)","success");
  }

});

function showMessage(text,type){

  messageBox.style.display = "block";
  messageBox.className = "message " + type;
  messageBox.textContent = text;
}

function hideMessage(){

  messageBox.style.display = "none";
}
</script>

</body>
</html>
